plugins {
	id 'fabric-loom'
	id 'maven-publish'
}

version = '1.2.0'
group = 'net.backshield'

base {
	archivesName = 'backshield'
}

repositories {
	// Trinkets e Mod Menu (Maven do TerraformersMC)
	maven { url "https://maven.terraformersmc.com/" }
	// Cardinal Components (dependencia do Trinkets)
	maven { url "https://maven.ladysnake.org/releases" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Trinkets (dependencia obrigatoria). Nao e embutido no jar: o jogador instala o Trinkets separado.
	modImplementation "dev.emi:trinkets:${project.trinkets_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

	// Mod Menu: so a API, para abrir a tela de configuracao. Opcional para o jogador.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "trinkets_version": project.trinkets_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
